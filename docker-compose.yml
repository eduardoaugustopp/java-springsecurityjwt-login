version: '3.8'
services:
  backend:
    image: login-backend
    build:
      context: .
    environment:
      - PROFILES_APP=prod  
      - DB_HOST=db_host_name 
      - DB_PORT=3306
      - DB_NAME=sistema_login
      - DB_USERNAME=root
      - DB_PASSWORD=root
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistema_login
    ports:
      - "3306:3306"
